[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "houseband-server"
version = "0.1.0"
description = "houseband app server: serves the web app and proxies the bandleader to an OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
houseband-server = "houseband_server.__main__:main"

[tool.setuptools]
packages = ["houseband_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
