[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jamstate-server"
version = "0.1.0"
description = "Jam State app server: serves the web app and proxies the bandleader to an OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
jamstate-server = "jamstate_server.__main__:main"

[tool.setuptools]
packages = ["jamstate_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
